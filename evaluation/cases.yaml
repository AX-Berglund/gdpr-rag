    is also to be regarded as a controller? Is the fact that the IT product used for the processing of
    personal data was created in accordance with the assignment formulated by the contracting authority
    significant for the interpretation of the concept of “controller”?
  - of the GDPR to be interpreted as also covering situations in which copies of personal data have been
    used for the testing of IT systems in the process for the acquisition of a mobile application?
  - of the GDPR be interpreted exclusively as involving deliberately coordinated actions in respect of
    the determination of the purpose and means of data processing, or can that concept also be interpreted
    as meaning that joint control also covers situations in which there is no clear “arrangement” in respect
    of the purpose and means of data processing and/or actions are not coordinated between the entities?
    Are the circumstance relating to the stage in the creation of the means of personal data processing
    (IT application) at which personal data were processed and the purpose of the creation of the application
    legally significant for the interpretation of the concept of joint control of data? Can an “arrangement”
    between joint controllers be understood exclusively as a clear and defined establishment of terms
    governing the joint control of data?
