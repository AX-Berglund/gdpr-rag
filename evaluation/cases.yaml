    of proportionality enshrined in recitals 4 and 129 thereof preclude national rules implementing the
    regulation, such as those at issue, which preclude and restrict from the outset the possibility of
    carrying out any video recording during the determination of the election results at polling stations,
    do not allow for differentiation and regulation of individual elements of the recording process and
    preclude the possibility of achieving the objectives of the regulation – the protection of personal
    data of individuals – by other means?
  - Alternatively, and in the context of the scope of application of EU law, do Article 6[(1)](e) of the
    [GDPR] and the principle of proportionality enshrined in recitals 4 and 129 thereof preclude – in
    the holding of municipal elections and elections to the European Parliament – national rules implementing
    that regulation, such as those at issue, which preclude and restrict from the outset the possibility
    of carrying out any video recording during the determination of the election results at polling stations,
    do not differentiate and regulate individual elements of the recording process or even allow for such
    differentiation and regulation, and preclude the possibility of achieving the objectives of the regulation
    – the protection of personal data of individuals – by other means?
