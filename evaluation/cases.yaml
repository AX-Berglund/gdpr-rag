    Union – and the data processing operations are not restricted to the collection of data in the context
    of the activity in question?
  - If the first question is answered in the affirmative, does the conclusion of the holding of elections
    to the National Assembly, which do not appear to fall within the scope of EU law, release controllers,
    processors and persons who store personal data from their obligations under the regulation, as the
    sole means of protecting personal data of EU citizens at EU level? Does the applicability of the regulation
    depend solely on the activity for which the personal data were produced or collected, thereby also
    leading to the conclusion that its subsequent applicability is precluded?
