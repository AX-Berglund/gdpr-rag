# Labelled retrieval evaluation set for the GDPR.
#
# Each entry names the article(s) that genuinely answer the question. Retrieval
# is scored on whether it surfaces them; the generator is scored on whether it
# cites them.
#
# Labelling rules used here:
#   - `articles` lists what a competent practitioner would cite, not every
#     article that mentions a keyword. Precision in the labels matters more
#     than coverage, because a loose label makes bad retrieval look good.
#   - Where an obligation lives in one article and its definition in another,
#     both are listed only if the question genuinely needs both.
#   - `unanswerable: true` marks questions the GDPR does not address. These
#     exist to measure refusal, not retrieval — a system that answers them
#     confidently is worse than one that declines.
#   - `colloquial` is the same question as a real user would actually type:
#     lowercase, unpunctuated, sometimes keywords rather than a sentence. The
#     `question` field is well-formed English, which flatters retrieval — the
#     pair exists so the gap between the two can be measured rather than
#     assumed. Both phrasings share one set of labels, so they cannot drift.
#
# Difficulty is a rough three-way split:
#   easy   - the answer is in one obvious article, keyword overlap is high
#   medium - needs the right article among several plausible neighbours
#   hard   - low keyword overlap, or the answer spans articles

