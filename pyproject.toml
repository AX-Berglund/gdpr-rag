[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gdpr-rag"
version = "0.2.0"
description = "Retrieval-augmented QA over the GDPR with cited articles and measured retrieval quality"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Axel Berglund" }]
keywords = ["rag", "retrieval", "gdpr", "nlp", "embeddings"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
# Default runtime: local embeddings, no API key and no cloud database required.
local = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
# Optional hosted backends.
openai = ["openai>=1.0", "python-dotenv>=1.0"]
demo = ["streamlit>=1.38"]
pdf = ["pdfminer.six>=20231228"]
dev = [
    "pytest>=8.0",
    # tomllib is stdlib only from 3.11; the deploy-manifest test reads pyproject.
    "tomli>=2.0; python_version < '3.11'",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
gdpr-rag = "gdpr_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gdpr_rag"]

# Ship the evaluation sets inside the wheel. They live at the repository root
# so people can read and edit them, but a package that loses them on install
# cannot have its results reproduced by anyone who did not clone it.
[tool.hatch.build.targets.wheel.force-include]
"evaluation" = "gdpr_rag/_data"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
